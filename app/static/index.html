<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mac Local Image Editor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="panel">
          <h1>Mac Local Image Editor</h1>
          <nav class="tabs" role="tablist">
            <button class="tab tab--active" data-tab="edit" role="tab" type="button">Edit</button>
            <button class="tab" data-tab="tryon" role="tab" type="button">Try On</button>
          </nav>

          <!-- ── Edit tab ── -->
          <form id="edit-form" class="tab-panel tab-panel--active" data-panel="edit">
            <label>
              Image
              <input id="image" name="image" type="file" accept="image/*" required />
            </label>
            <label>
              Edit prompt
              <textarea
                id="prompt"
                name="prompt"
                rows="5"
                placeholder="Make the sky dramatic, keep the subject unchanged"
                required
              ></textarea>
            </label>
            <div class="controls">
              <label>
                Steps
                <input name="steps" type="number" min="1" max="80" value="20" />
              </label>
              <label>
                Guidance
                <input name="guidance_scale" type="number" min="1" max="20" step="0.5" value="3.0" />
              </label>
              <label>
                Image lock
                <input
                  name="image_guidance_scale"
                  type="number"
                  min="0.5"
                  max="5"
                  step="0.1"
                  value="1.5"
                />
              </label>
              <label>
                Seed
                <input name="seed" type="number" placeholder="random" />
              </label>
            </div>
            <fieldset>
              <legend>Video</legend>
              <label class="checkbox">
                <input name="edit_first" type="checkbox" />
                Edit first
              </label>
              <div class="controls">
                <label>
                  Video steps
                  <input name="video_steps" type="number" min="1" max="80" value="25" />
                </label>
                <label>
                  Frames
                  <input name="frames" type="number" min="2" max="25" value="14" />
                </label>
                <label>
                  FPS
                  <input name="fps" type="number" min="1" max="30" value="7" />
                </label>
                <label>
                  Motion
                  <input name="motion_bucket_id" type="number" min="1" max="255" value="127" />
                </label>
              </div>
            </fieldset>
            <div class="actions">
              <button id="plan-button" type="button">Plan prompt</button>
              <button id="segment-button" type="button">Detect person</button>
              <button id="edit-button" type="submit">Generate edit</button>
              <button id="video-button" type="button">Generate video</button>
            </div>
          </form>
          <!-- ── Try On tab ── -->
          <form id="tryon-form" class="tab-panel" data-panel="tryon">
            <label>
              Person photo
              <input id="tryon-person" name="person_image" type="file" accept="image/*" required />
            </label>
            <label>
              Garment photo <span class="hint">(product image from collection)</span>
              <input id="tryon-garment" name="garment_image" type="file" accept="image/*" required />
            </label>
            <label>
              Garment description <span class="hint">(optional — improves accuracy)</span>
              <textarea
                id="tryon-prompt"
                name="prompt"
                rows="3"
                placeholder="black lace bra and matching panties"
              ></textarea>
            </label>
            <div class="controls">
              <label>
                Steps
                <input name="steps" type="number" min="1" max="80" value="30" />
              </label>
              <label>
                Guidance
                <input name="guidance_scale" type="number" min="1" max="10" step="0.5" value="2.0" />
              </label>
              <label>
                Seed
                <input name="seed" type="number" placeholder="random" />
              </label>
            </div>
            <div class="actions">
              <button id="tryon-button" type="submit">Try On</button>
            </div>
          </form>

          <div id="status" class="status">Checking local runtime...</div>
          <pre id="planned" class="planned"></pre>
        </aside>
        <section class="preview-grid">
          <figure>
            <figcaption>Person / Original</figcaption>
            <img id="source-preview" alt="" />
          </figure>
          <figure>
            <figcaption>Garment / Clothing mask</figcaption>
            <img id="mask-preview" alt="" />
          </figure>
          <figure>
            <figcaption>Result</figcaption>
            <img id="result-preview" alt="" />
          </figure>
          <figure class="video-figure">
            <figcaption>Video</figcaption>
            <video id="video-preview" controls loop playsinline></video>
          </figure>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
